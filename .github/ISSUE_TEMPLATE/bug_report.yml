name: Bug report
description: Report a reproducible cyanrex-lab problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve cyanrex-lab. Do not include credentials, TOTP seeds, session cookies, private keys, student data, or unpatched vulnerability details. Use the private security reporting link for vulnerabilities.
  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Deployment mode
      options:
        - Docker
        - WSL2
        - Native Linux
        - Distribution package
        - Development only
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.2.0 or git commit hash"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, kernel, architecture, browser, and container runtime versions when relevant.
      placeholder: |
        OS: Ubuntu 24.04
        Kernel: 6.x
        Architecture: x86_64
        Browser: Firefox
        Container runtime: Docker 27.x
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest repeatable sequence and sanitized input.
      placeholder: |
        1. Start with ...
        2. Open ...
        3. Run ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste relevant output from ./start.sh diagnose or logs. Redact secrets, hostnames, addresses, and personal data.
      render: shell
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report does not disclose an unpatched security vulnerability.
          required: true
        - label: I removed credentials, tokens, private host details, and student data.
          required: true
