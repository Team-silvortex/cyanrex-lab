name: Release Tag Validation

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  metadata:
    name: Validate immutable release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify annotated tag and synchronized release tree
        run: node scripts/release-preflight.mjs --tag "$GITHUB_REF_NAME"
