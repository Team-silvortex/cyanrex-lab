name: Release Candidate Validation

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate immutable release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify annotated tag and synchronized release tree
        run: node scripts/release-preflight.mjs --tag "$GITHUB_REF_NAME"

  distribution:
    name: Build and accept tagged distribution
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Resolve immutable release identity
        id: release
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          release_revision="$(git rev-list -n 1 "refs/tags/$GITHUB_REF_NAME")"
          printf 'version=%s\n' "$release_version" >> "$GITHUB_OUTPUT"
          printf 'revision=%s\n' "$release_revision" >> "$GITHUB_OUTPUT"
      - name: Build tagged offline distribution
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          ./scripts/package-distribution.sh --version "$RELEASE_VERSION" --skip-checks \
            --output "$RUNNER_TEMP/cyanrex-release"
      - name: Verify tag-bound artifact metadata
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_REVISION: ${{ steps.release.outputs.revision }}
        run: |
          cd "$RUNNER_TEMP/cyanrex-release"
          sha256sum -c ./*.tar.gz.sha256
          mkdir -p "$RUNNER_TEMP/cyanrex-release-extracted"
          tar -xzf ./*.tar.gz -C "$RUNNER_TEMP/cyanrex-release-extracted"
          package_dir="$(find "$RUNNER_TEMP/cyanrex-release-extracted" \
            -mindepth 1 -maxdepth 1 -type d -name 'cyanrex-lab-*' -print -quit)"
          test -n "$package_dir"
          node "$GITHUB_WORKSPACE/scripts/release-metadata.mjs" --verify "$package_dir" \
            --expect-version "$RELEASE_VERSION" --expect-revision "$RELEASE_REVISION" \
            --expect-tag "$GITHUB_REF_NAME" --expect-source-state clean --expect-image-mode built
      - name: Smoke test the exact candidate archive
        env:
          CYANREX_SMOKE_RUN_LIVE_KERNEL: "1"
          CYANREX_KERNEL_SMOKE_REPORT: ${{ runner.temp }}/cyanrex-live-kernel-acceptance.json
        run: |
          package_dir="$(find "$RUNNER_TEMP/cyanrex-release-extracted" \
            -mindepth 1 -maxdepth 1 -type d -name 'cyanrex-lab-*' -print -quit)"
          test -n "$package_dir"
          source "$package_dir/manifest.env"
          docker image rm "$ENGINE_IMAGE" "$FRONTEND_IMAGE" "$POSTGRES_IMAGE"
          "$package_dir/install-smoke.sh"
      - name: Assemble and verify accepted candidate bundle
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_REVISION: ${{ steps.release.outputs.revision }}
        run: |
          report="$RUNNER_TEMP/cyanrex-live-kernel-acceptance.json"
          cp "$report" "$RUNNER_TEMP/cyanrex-release/"
          (cd "$RUNNER_TEMP/cyanrex-release" && \
            sha256sum cyanrex-live-kernel-acceptance.json \
              > cyanrex-live-kernel-acceptance.json.sha256)
          python3 "$GITHUB_WORKSPACE/scripts/release-candidate.py" verify \
            "$RUNNER_TEMP/cyanrex-release" \
            --expect-version "$RELEASE_VERSION" \
            --expect-revision "$RELEASE_REVISION" \
            --expect-tag "$GITHUB_REF_NAME" \
            --expect-source-state clean \
            --expect-image-mode built
      - name: Upload accepted candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyanrex-lab-${{ github.ref_name }}
          path: ${{ runner.temp }}/cyanrex-release/*
          if-no-files-found: error
          retention-days: 30
