name: Release Candidate Validation

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate immutable release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify annotated tag and synchronized release tree
        run: node scripts/release-preflight.mjs --tag "$GITHUB_REF_NAME"

  distribution:
    name: Build and accept tagged distribution
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Resolve immutable release identity
        id: release
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          release_revision="$(git rev-list -n 1 "refs/tags/$GITHUB_REF_NAME")"
          printf 'version=%s\n' "$release_version" >> "$GITHUB_OUTPUT"
          printf 'revision=%s\n' "$release_revision" >> "$GITHUB_OUTPUT"
      - name: Build tagged offline distribution
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          ./scripts/package-distribution.sh --version "$RELEASE_VERSION" --skip-checks \
            --output "$RUNNER_TEMP/cyanrex-release"
      - name: Verify tag-bound artifact metadata
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_REVISION: ${{ steps.release.outputs.revision }}
        run: |
          cd "$RUNNER_TEMP/cyanrex-release"
          sha256sum -c ./*.tar.gz.sha256
          mkdir -p "$RUNNER_TEMP/cyanrex-release-extracted"
          tar -xzf ./*.tar.gz -C "$RUNNER_TEMP/cyanrex-release-extracted"
          package_dir="$(find "$RUNNER_TEMP/cyanrex-release-extracted" \
            -mindepth 1 -maxdepth 1 -type d -name 'cyanrex-lab-*' -print -quit)"
          test -n "$package_dir"
          node "$GITHUB_WORKSPACE/scripts/release-metadata.mjs" --verify "$package_dir" \
            --expect-version "$RELEASE_VERSION" --expect-revision "$RELEASE_REVISION" \
            --expect-tag "$GITHUB_REF_NAME" --expect-source-state clean --expect-image-mode built
      - name: Smoke test the exact candidate archive
        env:
          CYANREX_SMOKE_RUN_LIVE_KERNEL: "1"
          CYANREX_KERNEL_SMOKE_REPORT: ${{ runner.temp }}/cyanrex-live-kernel-acceptance.json
        run: |
          package_dir="$(find "$RUNNER_TEMP/cyanrex-release-extracted" \
            -mindepth 1 -maxdepth 1 -type d -name 'cyanrex-lab-*' -print -quit)"
          test -n "$package_dir"
          source "$package_dir/manifest.env"
          docker image rm "$ENGINE_IMAGE" "$FRONTEND_IMAGE" "$POSTGRES_IMAGE"
          "$package_dir/install-smoke.sh"
      - name: Verify live kernel acceptance evidence
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_REVISION: ${{ steps.release.outputs.revision }}
        run: |
          report="$RUNNER_TEMP/cyanrex-live-kernel-acceptance.json"
          package_dir="$(find "$RUNNER_TEMP/cyanrex-release-extracted" \
            -mindepth 1 -maxdepth 1 -type d -name 'cyanrex-lab-*' -print -quit)"
          test -n "$package_dir"
          metadata_sha256="$(sha256sum "$package_dir/release-metadata.json" | awk '{print $1}')"
          python3 - "$report" "$RELEASE_VERSION" "$RELEASE_REVISION" "$GITHUB_REF_NAME" \
            "$metadata_sha256" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          candidate = report.get("candidate") or {}
          exercise = report.get("exercise") or {}
          if report.get("schemaVersion") != 1 or report.get("result") != "passed":
              raise SystemExit("live kernel evidence does not report a passed v1 acceptance")
          if (candidate.get("package") or {}).get("version") != sys.argv[2]:
              raise SystemExit("live kernel evidence package version does not match the Tag")
          source = candidate.get("source") or {}
          if source.get("revision") != sys.argv[3] or source.get("tag") != sys.argv[4]:
              raise SystemExit("live kernel evidence source identity does not match the Tag")
          if candidate.get("releaseMetadataSha256") != sys.argv[5]:
              raise SystemExit("live kernel evidence is not bound to the candidate metadata")
          event = exercise.get("event") or {}
          if (
              exercise.get("runtimeBackend") != "aya"
              or exercise.get("templateId") != "ringbuf-hi-freq-sampler"
              or exercise.get("hook") != "tracepoint/sched/sched_switch"
              or event.get("type") != "ebpf.kernel_ringbuf"
              or event.get("bytes", 0) <= 0
          ):
              raise SystemExit("live kernel evidence omits the Aya ring-buffer event")
          if report.get("cleanup") != {"exactPinDetached": True, "remainingAttachments": 0}:
              raise SystemExit("live kernel evidence omits exact cleanup")
          PY
          (cd "$RUNNER_TEMP" && sha256sum cyanrex-live-kernel-acceptance.json \
            > cyanrex-live-kernel-acceptance.json.sha256)
      - name: Upload accepted candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyanrex-lab-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/cyanrex-release/*.tar.gz
            ${{ runner.temp }}/cyanrex-release/*.tar.gz.sha256
            ${{ runner.temp }}/cyanrex-live-kernel-acceptance.json
            ${{ runner.temp }}/cyanrex-live-kernel-acceptance.json.sha256
          if-no-files-found: error
          retention-days: 30
