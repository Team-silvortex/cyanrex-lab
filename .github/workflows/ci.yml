name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  permissions:
    name: Permission regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run permission regression checks
        run: ./scripts/quality-gate.sh --permissions-only

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Check security exceptions
        run: ./scripts/check-security-audit.sh

  file-lengths:
    name: File length limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: ./scripts/quality-gate.sh --format-only
      - name: Validate optional Agent Compose profiles
        env:
          POSTGRES_PASSWORD: compose-validation
          CYANREX_ADMIN_PASSWORD: compose-validation
          CYANREX_ADMIN_TOTP_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          CYANREX_RUNNER_AGENT_TOKEN_FILE: /tmp/cyanrex-agent-compose-token
        run: |
          docker compose -f docker/docker-compose.yml --profile runner-agent config >/dev/null
          docker compose -f docker/docker-compose.distribution.yml --profile runner-agent config >/dev/null

  engine:
    name: Rust engine
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cyanrex_test
          POSTGRES_DB: cyanrex_test
          # Disposable CI service credentials, never reused by a deployment.
          POSTGRES_PASSWORD: cyanrex-ci-only
        ports:
          - "127.0.0.1::5432"
        options: >-
          --health-cmd "pg_isready -U cyanrex_test -d cyanrex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target
      - name: Check formatting
        run: cargo fmt --manifest-path engine/Cargo.toml -- --check
      - name: Run tests
        run: cargo test --manifest-path engine/Cargo.toml --locked
      - name: Run real PostgreSQL learning integration
        env:
          CYANREX_DB_FALLBACK: "true"
          CYANREX_TEST_DATABASE_URL: postgres://cyanrex_test:cyanrex-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/cyanrex_test
        run: |
          set -euo pipefail
          task_pg_case=services::learning_store::feedback::tests::postgres_feedback_migrates_legacy_rows_and_serializes_updates
          cargo test --manifest-path engine/Cargo.toml --locked --lib "$task_pg_case" -- --ignored --list | grep -Fx "$task_pg_case: test"
          cargo test --manifest-path engine/Cargo.toml --locked --lib "$task_pg_case" -- --ignored --exact --nocapture
      - name: Run real Runner Agent compile integration
        run: cargo test --manifest-path engine/Cargo.toml --locked --test runner_agent_client_tdd -- --ignored --nocapture

  frontend:
    name: Next.js frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Run frontend regression checks
        working-directory: frontend
        run: |
          npm run test:performance-hotspots
          npm run test:event-stream
          npm run test:security-headers
          npm run test:tooling
      - name: Audit frontend production dependencies
        working-directory: frontend
        run: node ../scripts/check-npm-audit.mjs .

  sdk:
    name: JavaScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk-js/package-lock.json
      - name: Install dependencies
        working-directory: sdk-js
        run: npm ci
      - name: Build and test
        working-directory: sdk-js
        run: npm run check
      - name: Audit production dependencies
        working-directory: sdk-js
        run: node ../scripts/check-npm-audit.mjs .

  distribution:
    name: Distribution install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target
      - name: Build offline distribution
        run: ./scripts/package-distribution.sh --skip-checks --output "$RUNNER_TEMP/cyanrex-dist"
      - name: Verify and safely extract archive
        run: |
          cargo run --quiet --manifest-path "$GITHUB_WORKSPACE/engine/Cargo.toml" --locked --bin cyanrex-release -- package extract \
            "$RUNNER_TEMP/cyanrex-dist" --output "$RUNNER_TEMP/cyanrex-install"
      - name: Install and smoke test extracted package
        run: |
          package_dir="$(find "$RUNNER_TEMP/cyanrex-install" -mindepth 1 -maxdepth 1 -type d -name 'cyanrex-lab-*' -print -quit)"
          test -n "$package_dir"
          source "$package_dir/manifest.env"
          docker image rm "$ENGINE_IMAGE" "$FRONTEND_IMAGE" "$POSTGRES_IMAGE"
          "$package_dir/install-smoke.sh"

  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - security-audit
      - file-lengths
      - engine
      - frontend
      - sdk
      - permissions
      - distribution
    steps:
      - name: Validate all required jobs passed
        if: |
          always()
        run: |
          if [[ "${{ needs.security-audit.result }}" != "success" ]]; then
            echo "security-audit failed"
            exit 1
          fi
          if [[ "${{ needs.file-lengths.result }}" != "success" ]]; then
            echo "file-lengths failed"
            exit 1
          fi
          if [[ "${{ needs.engine.result }}" != "success" ]]; then
            echo "engine failed"
            exit 1
          fi
          if [[ "${{ needs.frontend.result }}" != "success" ]]; then
            echo "frontend failed"
            exit 1
          fi
          if [[ "${{ needs.sdk.result }}" != "success" ]]; then
            echo "sdk failed"
            exit 1
          fi
          if [[ "${{ needs.permissions.result }}" != "success" ]]; then
            echo "permissions failed"
            exit 1
          fi
          if [[ "${{ needs.distribution.result }}" != "success" ]]; then
            echo "distribution failed"
            exit 1
          fi
          echo "All checks passed."
