name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  permissions:
    name: Permission regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run permission regression checks
        run: ./scripts/quality-gate.sh --permissions-only

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Check security exceptions
        run: ./scripts/check-security-audit.sh

  file-lengths:
    name: File length limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: ./scripts/quality-gate.sh --format-only

  engine:
    name: Rust engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target
      - name: Check formatting
        run: cargo fmt --manifest-path engine/Cargo.toml -- --check
      - name: Run tests
        run: cargo test --manifest-path engine/Cargo.toml --locked

  frontend:
    name: Next.js frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build

  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - security-audit
      - file-lengths
      - engine
      - frontend
      - permissions
    steps:
      - name: Validate all required jobs passed
        if: |
          always()
        run: |
          if [[ "${{ needs.security-audit.result }}" != "success" ]]; then
            echo "security-audit failed"
            exit 1
          fi
          if [[ "${{ needs.file-lengths.result }}" != "success" ]]; then
            echo "file-lengths failed"
            exit 1
          fi
          if [[ "${{ needs.engine.result }}" != "success" ]]; then
            echo "engine failed"
            exit 1
          fi
          if [[ "${{ needs.frontend.result }}" != "success" ]]; then
            echo "frontend failed"
            exit 1
          fi
          if [[ "${{ needs.permissions.result }}" != "success" ]]; then
            echo "permissions failed"
            exit 1
          fi
          echo "All checks passed."
