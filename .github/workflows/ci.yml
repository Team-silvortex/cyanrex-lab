name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  permissions:
    name: Permission regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run permission regression checks
        run: ./scripts/quality-gate.sh --permissions-only

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Check security exceptions
        run: ./scripts/check-security-audit.sh

  file-lengths:
    name: File length limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: ./scripts/quality-gate.sh --format-only
      - name: Validate optional Agent Compose profiles
        env:
          POSTGRES_PASSWORD: compose-validation
          CYANREX_ADMIN_PASSWORD: compose-validation
          CYANREX_ADMIN_TOTP_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          CYANREX_RUNNER_AGENT_TOKEN_FILE: /tmp/cyanrex-agent-compose-token
        run: |
          docker compose -f docker/docker-compose.yml --profile runner-agent config >/dev/null
          docker compose -f docker/docker-compose.distribution.yml --profile runner-agent config >/dev/null

  engine:
    name: Rust engine
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cyanrex_test
          POSTGRES_DB: cyanrex_test
          # Disposable CI service credentials, never reused by a deployment.
          POSTGRES_PASSWORD: cyanrex-ci-only
        ports:
          - "127.0.0.1::5432"
        options: >-
          --health-cmd "pg_isready -U cyanrex_test -d cyanrex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target
      - name: Check formatting
        run: cargo fmt --manifest-path engine/Cargo.toml -- --check
      - name: Run tests
        run: cargo test --manifest-path engine/Cargo.toml --locked
      - name: Run real PostgreSQL learning integration
        env:
          CYANREX_DB_FALLBACK: "true"
          CYANREX_TEST_DATABASE_URL: postgres://cyanrex_test:cyanrex-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/cyanrex_test
        run: |
          set -euo pipefail
          task_pg_case=services::learning_store::feedback::tests::postgres_feedback_migrates_legacy_rows_and_serializes_updates
          cargo test --manifest-path engine/Cargo.toml --locked --lib "$task_pg_case" -- --ignored --list | grep -Fx "$task_pg_case: test"
          cargo test --manifest-path engine/Cargo.toml --locked --lib "$task_pg_case" -- --ignored --exact --nocapture
      - name: Run real PostgreSQL authentication integration
        env:
          CYANREX_DB_FALLBACK: "true"
          CYANREX_TEST_DATABASE_URL: postgres://cyanrex_test:cyanrex-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/cyanrex_test
        run: |
          set -euo pipefail
          for task_auth_pg_case in \
            services::auth_service::postgres_tests::postgres_registration_persists_accounts_and_serializes_duplicates \
            services::auth_service::postgres_tests::postgres_revoked_session_cannot_revive_in_fallback \
            services::auth_service::postgres_tests::postgres_expired_session_cannot_revive_in_fallback \
            services::auth_service::postgres_tests::postgres_deleted_account_cannot_revive_in_fallback \
            services::auth_service::postgres_mutation_tests::postgres_logout_write_failure_is_not_success \
            services::auth_service::postgres_mutation_tests::postgres_logout_zero_row_deletion_is_not_success \
            services::auth_service::postgres_mutation_tests::postgres_password_write_failure_is_not_success \
            services::auth_service::postgres_mutation_tests::postgres_account_deletion_failure_is_atomic \
            services::auth_service::postgres_mutation_tests::postgres_password_zero_row_update_is_not_success \
            services::auth_service::postgres_mutation_tests::postgres_account_zero_row_deletion_is_not_success \
            services::auth_service::postgres_mutation_tests::postgres_account_mutations_normalize_identity_and_persist \
            services::auth_service::postgres_mutation_tests::postgres_concurrent_password_changes_cannot_overwrite_newer_credentials \
            services::auth_service::postgres_boundary_tests::postgres_delete_session_step_failure_preserves_account_and_session \
            services::auth_service::postgres_boundary_tests::postgres_delete_deferred_commit_failure_rolls_back_account_and_sessions \
            services::auth_service::postgres_boundary_tests::postgres_delete_suppressed_session_cascade_cannot_report_success \
            services::auth_service::postgres_boundary_tests::postgres_cancelled_account_deletion_rolls_back_the_earlier_session_delete \
            services::auth_service::postgres_boundary_tests::postgres_login_cannot_report_success_after_its_account_was_deleted \
            services::auth_service::postgres_boundary_tests::postgres_old_login_cannot_authenticate_as_a_recreated_account \
            services::auth_service::postgres_boundary_tests::postgres_login_zero_row_session_insert_cannot_report_success \
            services::auth_service::postgres_boundary_tests::postgres_cancelled_classroom_join_never_reopens_its_consumed_invitation \
            services::auth_service::postgres_boundary_tests::postgres_cancelled_login_rolls_back_without_publishing_a_session \
            services::auth_service::postgres_boundary_tests::postgres_login_cannot_publish_after_concurrent_password_change; do
            cargo test --manifest-path engine/Cargo.toml --locked --lib "$task_auth_pg_case" -- --ignored --list | grep -Fx "$task_auth_pg_case: test"
            cargo test --manifest-path engine/Cargo.toml --locked --lib "$task_auth_pg_case" -- --ignored --exact --nocapture
          done
      - name: Run real PostgreSQL event and script boundaries
        env:
          CYANREX_DB_FALLBACK: "true"
          CYANREX_TEST_DATABASE_URL: postgres://cyanrex_test:cyanrex-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/cyanrex_test
        run: |
          set -euo pipefail
          task_event_pg_case=services::event_bus::tests::deletion::postgres_filtered_delete_preserves_uncached_rows_and_read_flags
          cargo test --manifest-path engine/Cargo.toml --locked --lib "$task_event_pg_case" -- --ignored --list | grep -Fx "$task_event_pg_case: test"
          cargo test --manifest-path engine/Cargo.toml --locked --lib "$task_event_pg_case" -- --ignored --exact --nocapture
          task_script_pg_case=script_postgres::scripts_use_postgres_without_file_fallback_and_keep_owner_boundaries_after_reload
          cargo test --manifest-path engine/Cargo.toml --locked --test module_boundaries_tdd "$task_script_pg_case" -- --ignored --list | grep -Fx "$task_script_pg_case: test"
          cargo test --manifest-path engine/Cargo.toml --locked --test module_boundaries_tdd "$task_script_pg_case" -- --ignored --exact --nocapture
      - name: Run real PostgreSQL event ordering and retention
        env:
          CYANREX_DB_FALLBACK: "true"
          CYANREX_TEST_DATABASE_URL: postgres://cyanrex_test:cyanrex-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/cyanrex_test
        run: |
          set -euo pipefail
          for task_event_pg_case in \
            services::event_bus::tests::persistence::postgres_mark_read_waits_for_previously_queued_events \
            services::event_bus::tests::persistence::postgres_deletion_cannot_be_undone_by_its_pending_publications \
            services::event_bus::tests::persistence::postgres_retention_update_cannot_be_overridden_by_queued_old_settings \
            services::event_bus::tests::persistence::postgres_failed_settings_update_preserves_memory_and_previous_policy \
            services::event_bus::tests::persistence::postgres_deletion_invalidates_drop_new_capacity_cache \
            services::event_bus::tests::persistence::postgres_publish_batch_really_persists_json_without_fallback \
            services::event_bus::tests::persistence::postgres_replacement_really_persists_and_marks_only_its_owner_read \
            services::event_bus::tests::persistence::followup::postgres_blocked_owner_mutation_does_not_hold_other_owners_publications \
            services::event_bus::tests::persistence::followup::postgres_equal_timestamp_latest_page_uses_publication_order \
            services::event_bus::tests::persistence::followup::postgres_equal_timestamp_retention_does_not_sort_by_event_type \
            services::event_bus::tests::persistence::followup::postgres_trim_failure_rolls_back_settings_and_preserves_retained_rows \
            services::event_bus::tests::persistence::followup::postgres_failed_replacement_does_not_lose_previous_durable_rows \
            services::event_bus::tests::persistence::followup::postgres_cancelled_admitted_settings_finish_before_later_publications \
            services::event_bus::tests::persistence::followup::postgres_cold_settings_read_cannot_overwrite_a_newer_cache_value \
            services::event_bus::tests::persistence::followup::postgres_drop_new_can_use_capacity_freed_by_deletion_immediately \
            services::event_bus::tests::persistence::followup::postgres_replacement_cannot_be_undone_by_queued_old_events \
            services::event_bus::tests::persistence::followup::postgres_failed_batch_releases_its_barrier_into_explicit_memory_fallback \
            services::event_bus::tests::persistence::cold_start::postgres_cold_full_drop_new_rejects_before_memory_unread_and_broadcast \
            services::event_bus::tests::persistence::cold_start::postgres_cold_partial_drop_new_counts_pending_publications_before_flush \
            services::event_bus::tests::persistence::cold_start::postgres_cold_drop_new_concurrent_clones_share_admission_and_owner_isolation \
            services::event_bus::tests::persistence::cold_start::postgres_writer_drains_multiple_batches_after_last_producer_drops \
            services::event_bus::tests::persistence::cold_start::postgres_cold_drop_new_mutations_rebase_durable_capacity \
            services::event_bus::tests::persistence::cold_start::postgres_cancelled_cold_drop_new_admission_does_not_lose_capacity \
            services::event_bus::tests::persistence::cold_start::postgres_cold_drop_new_count_failure_latches_memory_until_restart \
            services::event_bus::tests::persistence::reads::postgres_history_read_failure_is_unavailable_and_retryable \
            services::event_bus::tests::persistence::reads::postgres_export_read_failure_is_not_a_successful_download \
            services::event_bus::tests::persistence::reads::postgres_unread_read_failure_is_unavailable_not_zero \
            services::event_bus::tests::persistence::reads::postgres_schema_read_failure_is_retryable_without_memory_success \
            services::event_bus::tests::persistence::reads::postgres_read_timeout_releases_waiting_without_disabling_storage \
            services::event_bus::tests::persistence::reads::postgres_latched_fallback_reads_stay_unavailable_until_fresh_state \
            services::event_bus::tests::persistence::reads::postgres_payload_decode_failure_is_not_a_fabricated_empty_object \
            services::event_bus::tests::persistence::reads::postgres_timestamp_decode_failure_is_unavailable_not_a_panic \
            services::event_bus::tests::persistence::confirmed_mutations::postgres_mark_read_failure_preserves_unread_and_can_be_retried \
            services::event_bus::tests::persistence::confirmed_mutations::postgres_delete_failure_preserves_history_and_can_be_retried \
            services::event_bus::tests::persistence::confirmed_mutations::postgres_mutations_reject_latched_fallback_without_memory_changes \
            services::event_bus::tests::persistence::confirmed_mutations::postgres_failed_mutation_barrier_does_not_acknowledge_volatile_changes \
            services::event_bus::tests::persistence::confirmed_mutations::postgres_mutation_wait_deadline_does_not_claim_rollback_or_success \
            services::event_bus::tests::persistence::confirmed_mutations::postgres_cancelled_confirmed_mutation_finishes_before_later_publication \
            services::event_bus::tests::persistence::confirmed_mutations::postgres_mutation_sql_timeout_never_falls_back_to_memory_success \
            services::event_bus::tests::persistence::confirmed_mutations::postgres_mutation_schema_failure_preserves_memory_and_recovers \
            services::event_bus::tests::persistence::confirmed_mutations::postgres_confirmed_cold_delete_counts_sql_rows_and_preserves_read_flags \
            services::event_bus::tests::persistence::settings::postgres_settings_read_failure_is_not_cached_or_default_success \
            services::event_bus::tests::persistence::settings::postgres_settings_write_failure_is_private_and_atomic \
            services::event_bus::tests::persistence::settings::postgres_settings_prior_fallback_does_not_publish_or_trim_memory \
            services::event_bus::tests::persistence::settings::postgres_settings_failed_barrier_cannot_publish_or_trim_policy \
            services::event_bus::tests::persistence::settings::postgres_settings_corrupt_values_are_not_default_or_panicking_reads \
            services::event_bus::tests::persistence::settings::postgres_settings_commit_wait_is_bounded_without_claiming_rollback \
            services::event_bus::tests::persistence::settings::postgres_settings_read_deadline_and_cancellation_remain_retryable \
            services::event_bus::tests::persistence::settings::postgres_settings_cancelled_update_orders_later_events_under_new_policy \
            services::event_bus::tests::persistence::settings::postgres_settings_sql_timeout_preserves_uncommitted_policy_and_history \
            services::event_bus::tests::persistence::settings::postgres_settings_success_reloads_and_preserves_read_flags_and_capacity; do
            cargo test --manifest-path engine/Cargo.toml --locked --lib "$task_event_pg_case" -- --ignored --list | grep -Fx "$task_event_pg_case: test"
            cargo test --manifest-path engine/Cargo.toml --locked --lib "$task_event_pg_case" -- --ignored --exact --nocapture
          done
      - name: Run real PostgreSQL collaboration identity integration
        env:
          CYANREX_TEST_DATABASE_URL: postgres://cyanrex_test:cyanrex-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/cyanrex_test
        run: |
          set -euo pipefail
          for task_identity_pg_case in \
            postgres_identity_schema_and_bootstrap_are_repeatable_and_concurrent \
            postgres_identity_bootstrap_rejects_rebinding_and_preserves_archived_workspace \
            postgres_identity_binding_survives_reload_and_converges_without_duplicate_principals \
            postgres_identity_conflicting_generations_and_reused_account_ids_fail_closed \
            postgres_identity_retirement_keeps_history_and_never_revives_a_recreated_name \
            postgres_identity_scope_and_expected_principal_cannot_target_another_account \
            postgres_identity_missing_or_unknown_schema_is_not_empty_or_repaired_silently \
            postgres_identity_disabled_or_inconsistent_records_cannot_be_rebound \
            faults::postgres_identity_failed_bootstrap_leaves_no_partial_authority_or_workspace \
            faults::postgres_identity_binding_failure_rolls_back_the_principal \
            faults::postgres_identity_suppressed_binding_is_not_success \
            faults::postgres_identity_commit_failure_is_not_success \
            faults::postgres_identity_retirement_failure_keeps_both_principal_and_binding_active \
            faults::postgres_identity_retirement_commit_failure_preserves_the_active_mapping \
            faults::postgres_identity_cancelled_binding_rolls_back_without_publishing_an_id \
            timestamps::postgres_identity_nullable_retirement_rejects_invalid_nonnull_times_without_reviving_accounts \
            timestamps::postgres_identity_retirement_trigger_invalid_time_rolls_back_binding_and_principal; do
            cargo test --manifest-path engine/Cargo.toml --locked --test collaboration_identity_store_tdd "$task_identity_pg_case" -- --ignored --list | grep -Fx "$task_identity_pg_case: test"
            cargo test --manifest-path engine/Cargo.toml --locked --test collaboration_identity_store_tdd "$task_identity_pg_case" -- --ignored --exact --nocapture
          done
      - name: Run real PostgreSQL collaboration access integration
        env:
          CYANREX_TEST_DATABASE_URL: postgres://cyanrex_test:cyanrex-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/cyanrex_test
        run: |
          set -euo pipefail
          for task_access_pg_case in \
            postgres_access_schema_is_explicit_repeatable_and_fail_closed \
            postgres_access_policy_reload_and_compare_swap_prevent_stale_regrant \
            postgres_access_concurrent_writers_do_not_overwrite_reviewed_revisions \
            postgres_access_scope_and_unknown_identities_never_gain_access \
            policy::postgres_access_privacy_review_and_deployment_are_distinct \
            policy::postgres_access_suspension_archival_and_explicit_revocation_take_effect \
            policy::postgres_access_retirement_and_same_name_recreation_do_not_inherit_grants \
            policy::postgres_access_unknown_duplicate_or_ambiguous_roles_are_rejected \
            faults::postgres_access_failed_schema_install_rolls_back_without_repairing_legacy_data \
            faults::postgres_access_revision_exhaustion_and_ambiguous_persisted_roles_fail_closed \
            faults::postgres_access_altered_write_postcondition_is_not_acknowledged \
            faults::postgres_access_partial_or_suppressed_writes_never_commit \
            faults::postgres_access_deferred_commit_failure_preserves_prior_policy \
            faults::postgres_access_corrupt_or_missing_state_never_uses_cached_allow \
            faults::postgres_access_cancelled_change_and_waiting_preview_do_not_publish_stale_allow; do
            cargo test --manifest-path engine/Cargo.toml --locked --test collaboration_access_store_tdd "$task_access_pg_case" -- --ignored --list | grep -Fx "$task_access_pg_case: test"
            cargo test --manifest-path engine/Cargo.toml --locked --test collaboration_access_store_tdd "$task_access_pg_case" -- --ignored --exact --nocapture
          done
      - name: Run real PostgreSQL collaboration policy audit integration
        env:
          CYANREX_TEST_DATABASE_URL: postgres://cyanrex_test:cyanrex-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/cyanrex_test
        run: |
          set -euo pipefail
          for task_audit_pg_case in \
            postgres_audit_upgrade_is_explicit_repeatable_and_preserves_observed_baselines \
            postgres_audit_upgrade_rejects_unprepared_unknown_or_conflicting_storage \
            postgres_audit_command_replay_returns_history_without_regranting \
            postgres_audit_command_ids_bind_actor_revision_and_entire_desired_policy \
            postgres_audit_concurrent_commands_deduplicate_and_reject_stale_revisions \
            postgres_audit_noop_receipts_are_durable_and_role_order_is_canonical \
            permissions::postgres_audit_authority_scopes_isolate_bootstrap_commands_and_history \
            permissions::postgres_audit_requires_current_instance_authority_for_commands_and_history \
            permissions::postgres_audit_preserves_last_manager_and_rechecks_authority_on_replay \
            permissions::postgres_audit_history_is_bounded_keyset_scoped_and_append_only \
            permissions::postgres_audit_retired_incarnations_never_inherit_commands_or_authority \
            faults::postgres_audit_suppressed_or_tampered_receipt_rolls_back_policy_and_allows_retry \
            faults::postgres_audit_deferred_commit_failure_never_commits_policy_alone \
            faults::postgres_audit_cancellation_during_receipt_insert_rolls_back_prior_policy_writes \
            faults::postgres_audit_missing_history_or_unlogged_policy_edits_fail_closed_without_cache \
            faults::postgres_audit_invalid_baseline_rolls_back_schema_upgrade \
            timestamps::postgres_policy_audit_head_rejects_invalid_times_and_preserves_finite_boundaries \
            timestamps::postgres_policy_audit_old_receipt_times_fail_history_and_replay_with_healthy_head \
            timestamps::postgres_policy_audit_invalid_inserted_time_rolls_back_membership_grant_and_receipt
          do
            cargo test --manifest-path engine/Cargo.toml --locked --test collaboration_policy_audit_tdd "$task_audit_pg_case" -- --ignored --list | grep -Fx "$task_audit_pg_case: test"
            cargo test --manifest-path engine/Cargo.toml --locked --test collaboration_policy_audit_tdd "$task_audit_pg_case" -- --ignored --exact --nocapture
          done
      - name: Run real PostgreSQL collaboration identity audit integration
        env:
          CYANREX_TEST_DATABASE_URL: postgres://cyanrex_test:cyanrex-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/cyanrex_test
        run: |
          set -euo pipefail
          for task_lifecycle_pg_case in \
            postgres_lifecycle_upgrade_is_explicit_repeatable_and_fences_unattributed_writers \
            postgres_lifecycle_upgrade_requires_policy_audit_and_effective_managers \
            postgres_lifecycle_bind_retire_recreate_and_replay_never_reuse_an_incarnation \
            postgres_lifecycle_command_ids_bind_actor_scope_and_action \
            postgres_lifecycle_concurrent_commands_converge_and_record_noop_receipts \
            permissions::postgres_lifecycle_requires_current_manager_and_rejects_retired_actor_replay \
            permissions::postgres_lifecycle_retirement_and_grant_revocation_cannot_remove_all_managers \
            permissions::postgres_lifecycle_retirement_invalidates_policy_but_does_not_invent_session_revocation \
            permissions::postgres_lifecycle_conflicting_bindings_and_archived_workspace_never_gain_identity \
            permissions::postgres_lifecycle_history_is_bounded_scoped_and_append_only \
            faults::postgres_lifecycle_lookup_waits_for_binding_and_its_audit_before_reporting_absence \
            faults::postgres_lifecycle_suppressed_or_altered_audit_rolls_back_binding_and_retirement \
            faults::postgres_lifecycle_deferred_commit_failure_keeps_identity_and_audit_together \
            faults::postgres_lifecycle_cancellation_before_audit_commit_restores_active_identity \
            faults::postgres_lifecycle_missing_audit_or_unlogged_state_changes_fail_closed \
            faults::postgres_lifecycle_bad_baseline_or_conflicting_table_rolls_back_upgrade \
            timestamps::postgres_lifecycle_timestamp_reads_cover_nullable_retirement_head_history_and_old_replay \
            timestamps::postgres_lifecycle_audit_append_invalid_time_rolls_back_binding_and_retirement
          do
            cargo test --manifest-path engine/Cargo.toml --locked --test collaboration_identity_audit_tdd "$task_lifecycle_pg_case" -- --ignored --list | grep -Fx "$task_lifecycle_pg_case: test"
            cargo test --manifest-path engine/Cargo.toml --locked --test collaboration_identity_audit_tdd "$task_lifecycle_pg_case" -- --ignored --exact --nocapture
          done
      - name: Run real PostgreSQL durable authentication source integration
        env:
          CYANREX_TEST_DATABASE_URL: postgres://cyanrex_test:cyanrex-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/cyanrex_test
        run: |
          set -euo pipefail
          for task_auth_source_pg_case in \
            postgres_source_install_is_explicit_empty_only_scoped_and_repeatable \
            postgres_source_registration_and_login_keep_stable_incarnation_after_reload \
            postgres_source_duplicate_registration_commits_only_one_incarnation \
            postgres_source_recreated_name_never_reuses_identity_or_old_session \
            postgres_source_credentials_and_bounded_throttling_gate_session_issuance \
            postgres_source_logout_and_expiration_never_resurrect_cached_sessions \
            postgres_source_account_and_session_coordinates_cannot_be_reassigned \
            postgres_source_wrong_authority_and_token_shapes_never_select_an_identity \
            faults::postgres_source_missing_or_unknown_storage_never_uses_a_cached_identity \
            faults::postgres_source_suppressed_or_altered_writes_never_publish_success \
            faults::postgres_source_deferred_commit_failure_publishes_neither_account_nor_token \
            faults::postgres_source_cancelled_login_does_not_publish_a_durable_session \
            faults::postgres_source_session_read_waits_for_revocation_commit \
