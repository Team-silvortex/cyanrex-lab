services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}
      POSTGRES_DB: cyanrex
    ports:
      - "${CYANREX_BIND_ADDRESS:-127.0.0.1}:${CYANREX_POSTGRES_PORT:-15432}:5432"
    volumes:
      - cyanrex-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cyanrex"]
      interval: 5s
      timeout: 5s
      retries: 20

  engine:
    image: ${CYANREX_ENGINE_IMAGE:-cyanrex/cyanrex-engine:${CYANREX_IMAGE_TAG:-latest}}
    restart: unless-stopped
    # This is an intentionally privileged teaching sandbox. Never expose it to untrusted users.
    privileged: true
    pid: host
    cap_add:
      - BPF
      - PERFMON
      - SYS_ADMIN
      - SYS_RESOURCE
      - NET_ADMIN
    security_opt:
      - apparmor:unconfined
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      ENGINE_HOST: 0.0.0.0
      ENGINE_PORT: 8080
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/cyanrex
      RUST_LOG: info
      CYANREX_RUNTIME_MODE: docker
      CYANREX_MODULES_DIR: /app/modules
      CYANREX_ADMIN_USERNAME: admin
      CYANREX_INSTANCE_ID: ${CYANREX_INSTANCE_ID:-default}
      CYANREX_RUNNER_MODE: ${CYANREX_RUNNER_MODE:-local_process}
      CYANREX_RUNNER_MAX_CONCURRENT: ${CYANREX_RUNNER_MAX_CONCURRENT:-2}
      CYANREX_RUNNER_MAX_PER_USER: ${CYANREX_RUNNER_MAX_PER_USER:-1}
      CYANREX_RUNNER_TIMEOUT_SECS: ${CYANREX_RUNNER_TIMEOUT_SECS:-45}
      CYANREX_RUNNER_AGENT_TOKEN: ${CYANREX_RUNNER_AGENT_TOKEN:-}
      CYANREX_RUNNER_AGENT_TTL_SECS: ${CYANREX_RUNNER_AGENT_TTL_SECS:-30}
      CYANREX_RUNNER_AGENT_RETENTION_SECS: ${CYANREX_RUNNER_AGENT_RETENTION_SECS:-300}
      CYANREX_RUNNER_AGENT_SIGNATURE_WINDOW_SECS: ${CYANREX_RUNNER_AGENT_SIGNATURE_WINDOW_SECS:-60}
      CYANREX_ADMIN_PASSWORD: ${CYANREX_ADMIN_PASSWORD:?set CYANREX_ADMIN_PASSWORD in docker/.env}
      CYANREX_ADMIN_TOTP_SECRET: ${CYANREX_ADMIN_TOTP_SECRET:?set CYANREX_ADMIN_TOTP_SECRET in docker/.env}
      CYANREX_ALLOW_REGISTRATION: ${CYANREX_ALLOW_REGISTRATION:-false}
      CYANREX_ALLOW_TOTP_BOOTSTRAP: ${CYANREX_ALLOW_TOTP_BOOTSTRAP:-false}
      CYANREX_ALLOW_MISSING_ORIGIN: ${CYANREX_ALLOW_MISSING_ORIGIN:-false}
      CYANREX_SECURE_COOKIES: ${CYANREX_SECURE_COOKIES:-false}
      CYANREX_ROTATE_ADMIN_CREDENTIALS: ${CYANREX_ROTATE_ADMIN_CREDENTIALS:-false}
      CYANREX_EVENT_PERSIST_QUEUE_WARNING_ENABLED: ${CYANREX_EVENT_PERSIST_QUEUE_WARNING_ENABLED:-true}
      CYANREX_EVENT_PERSIST_QUEUE_WARNING_RATIO_PCT: ${CYANREX_EVENT_PERSIST_QUEUE_WARNING_RATIO_PCT:-80}
      CYANREX_EVENT_PERSIST_QUEUE_CLEAR_RATIO_PCT: ${CYANREX_EVENT_PERSIST_QUEUE_CLEAR_RATIO_PCT:-40}
      CYANREX_EVENT_PERSIST_QUEUE_WARNING_INTERVAL_MS: ${CYANREX_EVENT_PERSIST_QUEUE_WARNING_INTERVAL_MS:-10000}
      CYANREX_FRONTEND_PORT: ${CYANREX_FRONTEND_PORT:-3000}
      CYANREX_BIND_ADDRESS: ${CYANREX_BIND_ADDRESS:-127.0.0.1}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${CYANREX_BIND_ADDRESS:-127.0.0.1}:${CYANREX_ENGINE_PORT:-8080}:8080"
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf
      - /sys/kernel/tracing:/sys/kernel/tracing:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /lib/modules:/lib/modules:ro
    networks:
      - default
      - runner-agent-control
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    image: ${CYANREX_FRONTEND_IMAGE:-cyanrex/cyanrex-frontend:${CYANREX_IMAGE_TAG:-latest}}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_ENGINE_URL: http://localhost:${CYANREX_ENGINE_PORT:-8080}
    depends_on:
      engine:
        condition: service_healthy
    ports:
      - "${CYANREX_BIND_ADDRESS:-127.0.0.1}:${CYANREX_FRONTEND_PORT:-3000}:3000"

  runner-agent:
    image: ${CYANREX_ENGINE_IMAGE:-cyanrex/cyanrex-engine:${CYANREX_IMAGE_TAG:-latest}}
    profiles: ["runner-agent"]
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/cyanrex-runner-agent"]
    user: "${CYANREX_AGENT_RUNTIME_UID:-65532}:${CYANREX_AGENT_RUNTIME_GID:-65532}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 1536m
    cpus: 1.0
    stop_grace_period: 15s
    environment:
      RUST_LOG: info
      CYANREX_AGENT_ENGINE_URL: http://engine:8080
      CYANREX_AGENT_BOOTSTRAP_TOKEN_FILE: /run/secrets/cyanrex-agent-bootstrap-token
      CYANREX_AGENT_ID: ${CYANREX_AGENT_ID:-cyanrex-docker-compiler}
      CYANREX_AGENT_ISOLATION: container
      CYANREX_AGENT_MAX_CONCURRENT: ${CYANREX_AGENT_MAX_CONCURRENT:-1}
      CYANREX_AGENT_CAPABILITIES: control_probe
      CYANREX_AGENT_ENABLE_COMPILE_CHECK: "true"
      CYANREX_AGENT_CLANG_PATH: /usr/bin/clang
      CYANREX_AGENT_COMPILE_WORK_DIR: /tmp/cyanrex-runner-agent
      CYANREX_AGENT_POLL_SECS: ${CYANREX_AGENT_POLL_SECS:-2}
      CYANREX_AGENT_REQUEST_TIMEOUT_SECS: ${CYANREX_AGENT_REQUEST_TIMEOUT_SECS:-10}
      CYANREX_AGENT_ALLOW_INSECURE_HTTP: "true"
    depends_on:
      engine:
        condition: service_healthy
    secrets:
      - source: runner_agent_bootstrap
        target: cyanrex-agent-bootstrap-token
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=134217728,mode=1777
    networks:
      - runner-agent-control

secrets:
  runner_agent_bootstrap:
    file: ${CYANREX_RUNNER_AGENT_TOKEN_FILE:-./.runner-agent-token}

networks:
  runner-agent-control:
    internal: true

volumes:
  cyanrex-postgres-data:
    name: ${CYANREX_POSTGRES_VOLUME_NAME:-cyanrex-postgres-data-${CYANREX_INSTANCE_ID:-default}}
